name: Deploy server and website

run-name: Deploy ${{ inputs.source_sha }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA from lonelam/aalookup to deploy
        required: true
        type: string
      client_release_tag:
        description: Optional client release associated with this website rollout; requires approval of its exact source
        required: false
        type: string
      request_id:
        description: Unique caller ID used to find this workflow run
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    defaults:
      run:
        working-directory: source

    steps:
      - name: Validate source revision
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lonelam/aalookup
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.AALOOKUP_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked out revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $checked_out_sha instead of requested $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # Two thirds of this job is cargo: the host debug build behind
      # `cargo test` and the musl release build, both from scratch.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: server
          workspaces: source
          cache-on-failure: true

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools openssl

      - name: Install website dependencies
        run: npm ci

      - name: Verify audited study mirror
        run: npm run study:content:verify

      - name: Verify deployment architecture
        run: npm run architecture:test

      # The helper this job is about to invoke on production. Its tests live
      # beside it in the source repository rather than in the architecture
      # glob, so without naming them here nothing in this job covers the thing
      # doing the installing.
      - name: Verify the production deploy helper
        run: npm run server:deploy:test

      - name: Build website
        env:
          GLITCHTIP_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # Hidden source maps, uploaded to the aalookup-website project and
          # then deleted from dist/ — a map left there would be one guessed URL
          # away from publishing the site's source. scripts/symbols.mjs does
          # both halves and refuses to leave them behind.
          if [[ -n "${GLITCHTIP_AUTH_TOKEN:-}" ]]; then
            export AALOOKUP_UPLOAD_SYMBOLS=1
          else
            echo "::warning::No GLITCHTIP_AUTH_TOKEN; the website ships without source maps"
          fi
          npm run site:build

      # The launcher owns an isolated PostgreSQL 17 container, TLS credentials,
      # per-test databases, and matching pg_dump/pg_restore client wrappers.
      - name: Test server against PostgreSQL 17
        run: |
          docker info >/dev/null
          node scripts/test-postgres.mjs -- test --locked -p aalookup-server --all-targets --all-features

      - name: Build server
        run: >-
          cargo build --locked --release -p aalookup-server -p aalookup-event-log
          --bin aalookup-server --bin aalookup-backup
          --bin aalookup-database --bin aalookup-membership-transition --bin aalookup-event-log
          --target x86_64-unknown-linux-musl

      - name: Package deployment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          install -d deploy/website
          binaries=(aalookup-server aalookup-backup aalookup-database aalookup-membership-transition aalookup-event-log)
          for name in "${binaries[@]}"; do
            binary="target/x86_64-unknown-linux-musl/release/$name"
            if [[ ! -f "$binary" || -L "$binary" || ! -s "$binary" ]]; then
              echo "Missing regular nonempty deployment binary: $name" >&2
              exit 1
            fi
            file "$binary" | tee /dev/stderr \
              | grep --quiet --extended-regexp "static(ally|-pie)? linked"
            install -m 0755 "$binary" "deploy/$name"
            # Linux keeps the workspace's line tables inside each ELF. Strip
            # only the shipping copy; retain the original build for diagnostics.
            strip --strip-debug "deploy/$name"
            printf '%s build bytes: ' "$name"
            wc -c < "$binary"
            printf '%s deployment bytes: ' "$name"
            wc -c < "deploy/$name"
            sha256sum "deploy/$name"
          done
          cp -a website/dist/. deploy/website/
          tar -C deploy -czf "aalookup-${SOURCE_SHA}.tar.gz" .
          python3 <<'PY'
          import os
          from pathlib import Path
          archive = Path(f"aalookup-{os.environ['SOURCE_SHA']}.tar.gz")
          files = [entry for entry in Path("deploy").rglob("*") if entry.is_file()]
          packed = archive.stat().st_size
          unpacked = sum(entry.stat().st_size for entry in files)
          print(f"Deployment archive bytes: {packed}; expanded file bytes: {unpacked}")
          if packed > 104857600 or unpacked > 536870912:
              raise SystemExit("Deployment exceeds the host's 100 MiB archive or 512 MiB expanded limit")
          PY
          sha256sum "aalookup-${SOURCE_SHA}.tar.gz"

      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .aalookup-hub
          persist-credentials: false

      - name: Check approval for a client-associated website rollout
        if: ${{ inputs.client_release_tag != '' }}
        working-directory: ${{ github.workspace }}
        env:
          CLIENT_RELEASE_TAG: ${{ inputs.client_release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: python3 .aalookup-hub/scripts/check_client_release.py

      - name: Verify trusted deployment tooling
        run: python3 -m unittest discover -s ../.aalookup-hub/tests

      - name: Deploy production
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 ../.aalookup-hub/scripts/deploy_production.py
