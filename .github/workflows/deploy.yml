name: Deploy server and website

run-name: Deploy ${{ inputs.source_sha }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA from lonelam/aalookup to deploy
        required: true
        type: string
      request_id:
        description: Unique caller ID used to find this workflow run
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    defaults:
      run:
        working-directory: source

    steps:
      - name: Validate source revision
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lonelam/aalookup
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.AALOOKUP_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked out revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $checked_out_sha instead of requested $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      # Two thirds of this job is cargo: the host debug build behind
      # `cargo test` and the musl release build, both from scratch.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: server
          workspaces: source
          cache-on-failure: true

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes file musl-tools openssl

      - name: Install website dependencies
        run: npm ci

      - name: Verify audited study mirror
        run: npm run study:content:verify

      - name: Verify deployment architecture
        run: npm run architecture:test

      # The helper this job is about to invoke on production. Its tests live
      # beside it in the source repository rather than in the architecture
      # glob, so without naming them here nothing in this job covers the thing
      # doing the installing.
      #
      # --if-present because this job checks out whichever source revision was
      # asked for, including one older than the script: a rollback to an
      # earlier release must not fail on a missing test.
      - name: Verify the production deploy helper
        run: npm run server:deploy:test --if-present

      - name: Build website
        run: npm run site:build

      # The launcher owns an isolated PostgreSQL 17 container, TLS credentials,
      # per-test databases, and matching pg_dump/pg_restore client wrappers.
      - name: Test server against PostgreSQL 17
        run: |
          docker info >/dev/null
          node scripts/test-postgres.mjs -- test --locked -p aalookup-server --all-targets --all-features

      - name: Build server
        run: >-
          cargo build --locked --release -p aalookup-server --bins
          --target x86_64-unknown-linux-musl

      - name: Package deployment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          install -d deploy/website
          for name in aalookup-server aalookup-backup aalookup-database; do
            binary="target/x86_64-unknown-linux-musl/release/$name"
            file "$binary" | tee /dev/stderr \
              | grep --quiet --extended-regexp "static(ally|-pie)? linked"
            install -m 0755 "$binary" "deploy/$name"
          done
          cp -a website/dist/. deploy/website/
          tar -C deploy -czf "aalookup-${SOURCE_SHA}.tar.gz" .

      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .aalookup-hub
          persist-credentials: false

      - name: Deploy production
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 ../.aalookup-hub/scripts/deploy_production.py
