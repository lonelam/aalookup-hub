name: Deploy server and website

run-name: Deploy ${{ inputs.source_sha }} [${{ inputs.request_id }}]

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA from lonelam/aalookup to deploy
        required: true
        type: string
      request_id:
        description: Unique caller ID used to find this workflow run
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    defaults:
      run:
        working-directory: source

    steps:
      - name: Validate source revision
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full 40-character lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lonelam/aalookup
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.AALOOKUP_SOURCE_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked out revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD)"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            echo "Checked out $checked_out_sha instead of requested $SOURCE_SHA" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes file musl-tools

      - name: Install website dependencies
        run: npm ci

      - name: Verify audited study mirror
        run: npm run study:content:verify

      - name: Verify deployment architecture
        run: npm run architecture:test

      - name: Build website
        run: npm run site:build

      - name: Test server
        run: cargo test --locked -p aalookup-server

      - name: Build server
        run: >-
          cargo build --locked --release -p aalookup-server
          --target x86_64-unknown-linux-musl

      - name: Package deployment
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          server_binary="target/x86_64-unknown-linux-musl/release/aalookup-server"
          file "$server_binary" | tee /dev/stderr \
            | grep --quiet --extended-regexp "static(ally|-pie)? linked"

          install -d deploy/website
          install -m 0755 "$server_binary" deploy/aalookup-server
          cp -a website/dist/. deploy/website/
          tar -C deploy -czf "aalookup-${SOURCE_SHA}.tar.gz" .

      - name: Checkout trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .aalookup-hub
          persist-credentials: false

      - name: Deploy production
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash ../.aalookup-hub/scripts/deploy-production.sh
